[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "room-detector"
version = "0.1.0"
description = "Indoor room detection from ESP32 WiFi Channel State Information"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sarthak Doshi" }]
keywords = ["csi", "esp32", "wifi-sensing", "indoor-positioning", "localization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "scikit-learn>=1.0",
    "joblib>=1.1",
    "pyserial>=3.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5", "pandas>=1.3"]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
room-detector = "room_detector.cli:main"

[project.urls]
Homepage = "https://github.com/SdSarthak/Room_Detector"

[tool.setuptools]
packages = ["room_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
