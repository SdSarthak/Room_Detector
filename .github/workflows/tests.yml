name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The parser tests assert against the real capture shipped with the
          # ESP32-CSI-Tool firmware, so the submodule must be present.
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn joblib pyserial pyyaml pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test the pipeline end to end
        run: |
          python examples/generate_demo_data.py --captures 2 --packets 150
          python -m room_detector inspect data/kitchen/capture_00.csv
          python -m room_detector train
          python -m room_detector predict --file data/kitchen/capture_00.csv
